name: verify-release
# Checks dist/SHA256SUMS in the repo against the actual bytes of the release assets.
on:
  pull_request:
    paths: ["dist/SHA256SUMS", ".github/workflows/verify-release.yml"]
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify (default: latest)"
        required: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          tag="$EVENT_TAG"
          [ -n "$tag" ] || tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "${{ steps.tag.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --dir assets
          ls -l assets
      - name: Verify checksums
        run: |
          set -euo pipefail
          # 1) every file listed in the repo's dist/SHA256SUMS must exist in the release and match
          (cd assets && sha256sum -c ../dist/SHA256SUMS)
          # 2) the SHA256SUMS asset attached to the release must equal the one in the repo
          if [ -f assets/SHA256SUMS ]; then
            diff <(sort assets/SHA256SUMS) <(sort dist/SHA256SUMS) && echo "release SHA256SUMS == repo SHA256SUMS"
          fi
          # 3) no unlisted binary assets
          for f in assets/*; do
            n="$(basename "$f")"; [ "$n" = SHA256SUMS ] && continue
            grep -q "  $n\$" dist/SHA256SUMS || { echo "UNLISTED asset: $n"; exit 1; }
          done
